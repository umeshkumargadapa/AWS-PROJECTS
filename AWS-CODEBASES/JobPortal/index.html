<!DOCTYPE html>
<html>
<head>
    <title>Job Application Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Job Application Portal</h1>

        <h2>Software Developer</h2>

        <p><b>Company:</b> Demo Technologies Pvt Ltd</p>
        <p><b>Location:</b> Hyderabad</p>
        <p><b>Experience:</b> 0-2 Years</p>
        <p><b>Skills:</b> Java, SQL, HTML, CSS</p>

        <h2>Apply Now</h2>

        <input type="text" id="fullName" placeholder="Full Name">

        <input type="email" id="email" placeholder="Email Address">

        <input type="text" id="phoneNumber" placeholder="Phone Number">

        <input type="text" id="qualification" placeholder="Qualification">

        <input type="text" id="experience" placeholder="Years of Experience">

        <input type="text" id="skills" placeholder="Skills">

        <textarea id="coverLetter" placeholder="Cover Letter"></textarea>

        <button onclick="applyJob()">Apply Now</button>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
